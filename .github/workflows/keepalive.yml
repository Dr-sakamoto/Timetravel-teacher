name: Keep relay awake

# 通信対戦の中継サーバー（Supabase の無料プロジェクト）は、しばらく使われないと休止するので、ときどきアクセスしておく
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -o /dev/null -w "%{http_code}\n" "https://cyxprbysihbrjtckaxqe.supabase.co/rest/v1/" -H "apikey: sb_publishable_zU9Slge0coUocJzPMGt_vQ_0CX1bQqO"
          curl -sS -o /dev/null -w "%{http_code}\n" "https://cyxprbysihbrjtckaxqe.supabase.co/auth/v1/health" -H "apikey: sb_publishable_zU9Slge0coUocJzPMGt_vQ_0CX1bQqO"
