name: Keep relay awake

# 通信対戦の中継サーバー（Supabase の無料プロジェクト）は、しばらく使われないと休止する。
# REST のルートや auth の health だけを叩く方法では休止を防げなかったので、
# データベースの表（public.keepalive・1行だけ・公開キーで読むだけ）を毎日読む。
# つながらない時は失敗として気づけるよう curl -f にしている
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS --retry 3 --retry-delay 10 "https://cyxprbysihbrjtckaxqe.supabase.co/rest/v1/keepalive?select=id&limit=1" -H "apikey: sb_publishable_zU9Slge0coUocJzPMGt_vQ_0CX1bQqO"
          echo
